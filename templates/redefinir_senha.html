<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redefinir Senha</title>

    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='imagens/neotemisico.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Platypi:ital,wght@0,300..800;1,300..800&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/scripts.js') }}" defer></script>

</head>

<body class="body-auth">
    
    <div class="recuperar-box">

        <img src="{{ url_for('static', filename='imagens/neotemis.png') }}"
         alt="Logo NeoTêmis" class="logo">

        <form method="POST">

            <h2 class="recuperar-titulo">
                Nova Senha
            </h2>

            {% if erro %}

            <span class="mensagem-erro mostrar-erro">
                {{ erro }}
            </span>

            {% endif %}

            <input 
                type="password"
                name="nova_senha"
                placeholder="Digite a nova senha"
                required
            >

            <input 
                type="password"
                name="confirmar_senha"
                placeholder="Confirme a nova senha"
                required
            >

            <button type="submit">
                ALTERAR SENHA
            </button>
        </form>

    </div>

</body>
</html>
